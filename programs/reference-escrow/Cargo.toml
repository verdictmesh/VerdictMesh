[package]
name = "reference-escrow"
version = "0.1.0"
edition = "2021"
description = "Milestone escrow that resolves disputes through VerdictMesh"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "reference_escrow"

[lints]
workspace = true

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
anchor-debug = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { workspace = true }
anchor-spl = { workspace = true }
verdict-mesh = { path = "../verdict-mesh", features = ["no-entrypoint"] }

[dev-dependencies]
mollusk-svm = "0.15.0"
