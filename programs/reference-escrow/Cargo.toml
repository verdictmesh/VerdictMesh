[package]
name = "reference-escrow"
version = "0.1.0"
edition = "2021"
description = "Milestone escrow that resolves disputes through VerdictMesh"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "reference_escrow"

[lints]
workspace = true

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
anchor-debug = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { workspace = true }
anchor-spl = { workspace = true }
# `cpi`, а не `no-entrypoint`: відкриття спору — це виклик у VerdictMesh, і
# модуль `verdict_mesh::cpi` існує лише під цією ознакою. `no-entrypoint` вона
# вмикає сама, тож точка входу чужої програми сюди все одно не потрапляє.
verdict-mesh = { path = "../verdict-mesh", features = ["cpi"] }
# Відбитки тверджень сторін (`claims`). Уже в графі через anchor-spl, тож пряма
# залежність не додає в дерево нічого нового.
solana-keccak-hasher = "2.2.1"

[dev-dependencies]
# Обидві програми в одному mollusk: інакше CPI у VerdictMesh перевірявся б
# заглушкою, тобто не перевірявся б.
mollusk-svm = "0.15.0"
mollusk-svm-programs-token = { version = "0.15.0", default-features = false, features = [
  "token",
] }
solana-account = "4.3.2"
solana-address = "2.6.1"
solana-instruction = "3.4.1"
solana-instruction-error = "2.4.0"
solana-svm-log-collector = "4.2.1"
solana-program-pack = "3.1.0"
spl-token-interface = "2.0.0"
base64 = "0.22.1"
