[package]
name = "verdict-mesh"
version = "0.1.0"
edition = "2021"
description = "Protocol-agnostic dispute resolution layer for Solana"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "verdict_mesh"

[lints]
workspace = true

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
anchor-debug = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { workspace = true, features = ["init-if-needed"] }
anchor-spl = { workspace = true }
# Уже в графі через anchor-spl → spl-associated-token-account → solana-program,
# тож пряма залежність не додає в дерево нічого нового. Anchor 0.32.1 сам
# хешування не реекспортує.
solana-keccak-hasher = "2.2.1"

[dev-dependencies]
mollusk-svm = "0.15.0"
solana-account = "4.3.2"
solana-address = "2.6.1"
# Версії підібрані під mollusk 0.15: він приймає `Instruction` саме з цих
# крейтів. Розбіжність у мажорі дала б два несумісні `Instruction` з однаковою
# назвою і повідомлення компілятора, у якому це не видно.
solana-instruction = "3.4.1"
solana-instruction-error = "2.4.0"
# Події Anchor не лишають сліду в акаунтах — читати їх можна лише з логів
# програми, а лог `Program data:` закодований у base64.
solana-svm-log-collector = "4.2.1"
base64 = "0.22.1"
# Справжня програма SPL Token усередині mollusk. Стейк — це перший переказ чужих
# коштів у проекті, і перевіряти його підробленим токен-акаунтом означало б
# перевіряти власну фікстуру: тут CPI виконує той самий байткод, що на devnet.
mollusk-svm-programs-token = { version = "0.15.0", default-features = false, features = [
  "token",
] }
# Розклад мінта і токен-акаунта. Пакування вручну коштувало б тих самих
# залежностей, але помилка в зміщенні виглядала б як помилка програми.
spl-token-interface = "2.0.0"
solana-program-pack = "3.1.0"
# Сисвар SlotHashes у mollusk заповнений нулями за замовчуванням: ентропія
# вийшла б однаковою для всіх слотів, і тест «інший слот — інша панель» був би
# зеленим ні від чого.
solana-slot-hashes = "3.0.1"
solana-hash = "4.2.0"
# IDL — єдиний реєстр інструкцій, який існує поза головою автора: `FR-014`
# доводиться переліком поверхні програми, а перелік треба звідкись прочитати.
# Уже в графі через `anchor-lang/idl-build`, тож у дерево нічого не додає.
serde_json = "1.0.151"
