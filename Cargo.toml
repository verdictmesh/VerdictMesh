[workspace]
members = ["programs/*"]
resolver = "2"

# Макроси Anchor розгортають cfg, яких хостова ціль не знає: target_os="solana"
# існує лише для SBF, а custom-heap/custom-panic вмикає лінкер програми. На
# `cargo check` це 12 попереджень на порожньому крейті — рівно той шум, у якому
# потім губиться справжнє попередження.
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
  'cfg(target_os, values("solana"))',
  'cfg(feature, values("custom-heap", "custom-panic", "anchor-debug"))',
] }

[workspace.dependencies]
anchor-lang = "0.32.1"
anchor-spl = "0.32.1"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
