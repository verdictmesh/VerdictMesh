# One Pages site, two folders:
#   https://verdictmesh.github.io/VerdictMesh/       apps/landing — static, no build
#   https://verdictmesh.github.io/VerdictMesh/app/   apps/web — reads hearings from
#     apps/api on Render and sends a juror's votes straight from the juror's wallet
#     to devnet.
# The on-chain programs are not built here.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A second push must not overtake the first: deployments run in order, not in parallel.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # takes the version from package.json → packageManager

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @verdictmesh/web exec vite build
        env:
          # A project site lives under /<repo>/, and the app one folder below the landing.
          PAGES_BASE: /${{ github.event.repository.name }}/app/
          # Where apps/api answers: the service `verdictmesh-api` in render.yaml.
          VITE_API_URL: https://verdictmesh-api.onrender.com
          # The page's own RPC, for the juror's accounts and votes. Public by
          # construction — it ships in the bundle — so it is a key of its own,
          # in a Helius account that holds nothing else: never the key the api
          # runs on. If its credits are burnt, removing this line falls back to
          # the public devnet RPC.
          VITE_SOLANA_RPC_URL: https://devnet.helius-rpc.com/?api-key=a0f40f06-735c-4921-bf9f-7bda54679baa

      # The landing at the root, the app under app/.
      # Pages has no SPA fallback, and it serves a custom 404 only from the site root:
      # app/404.html would be ignored. So the root 404 is the app's own index.html,
      # and a direct hit on /app/hearing/<address> boots the router there. A miss
      # outside /app/ would boot the app under the wrong base and render nothing,
      # so the 404 sends those back to the landing before the app loads.
      - env:
          SITE: /${{ github.event.repository.name }}/
        run: |
          mkdir -p site
          cp -r apps/landing/. site/
          cp -r apps/web/dist site/app
          sed "s|<head>|<head><script>if(!location.pathname.startsWith('${SITE}app/'))location.replace('${SITE}')</script>|" \
            apps/web/dist/index.html > site/404.html
          grep -q "location.replace('${SITE}')" site/404.html

      # Pages is enabled once by the repository owner: Settings → Pages → Source:
      # "GitHub Actions". GITHUB_TOKEN cannot create the site itself, so this step
      # only reads the existing configuration.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
